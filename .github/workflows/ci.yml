name: Continuous Integration

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  security-audit:
    name: 🔒 Dependency Audit
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Use Node.js 22.x
      uses: actions/setup-node@v7
      with:
        node-version: 22.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    # Dépendances de production uniquement : ce sont elles qui tournent en prod.
    - name: Fail on high/critical vulnerabilities (production dependencies)
      run: npm audit --omit=dev --audit-level=high

  build-and-test:
    runs-on: ubuntu-latest

    # Node 20 est en fin de vie (avril 2026) et Node 18 depuis longtemps :
    # seules les versions LTS supportées sont testées.
    strategy:
      matrix:
        node-version: [22.x, 24.x]

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v7

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    # Vérifie réellement (échoue si non conforme), contrairement à `npm run format`
    # qui réécrit les fichiers sans jamais échouer.
    - name: Lint
      run: npm run lint

    - name: Format check
      run: npx prettier --check "src/**/*.ts"

    - name: Build project
      run: npm run build

    - name: Run tests
      env:
        MONGODB_URI: mongodb://localhost:27017/kauri_test
        REDIS_URL: redis://localhost:6379
        NODE_ENV: test
      run: npm test
