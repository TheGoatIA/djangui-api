# docker-compose.prod.yml
#
# name: fixe explicitement le préfixe de tous les conteneurs/réseau/volumes
# (kauri-prod-api-1, kauri-prod-mongodb-1...) au lieu de le dériver du nom du
# dossier serveur (qui donnait juste "api" — collision possible avec un futur
# projet différent aussi nommé "api"). Migration effectuée le 29/08/2026,
# voir RUNBOOK.md § Migration de renommage des conteneurs.
# Ce fichier est référencé par le job `deploy_production` de
# .github/workflows/deploy.yml, qui pointait vers un fichier inexistant
# jusqu'ici (vérifié sur le dépôt ET sur le serveur de production —
# aucune des deux copies n'existait). En pratique, la production tourne
# depuis le début via `docker-compose.yml` lancé manuellement sur le
# serveur, avec les ports réels définis dans le `.env` du serveur
# (PORT, PROMETHEUS_PORT, GRAFANA_PORT, etc.) — ce fichier compose est
# déjà paramétré pour ça, donc cette copie produit un comportement
# identique à ce qui tourne déjà, elle ne fait que rendre le pipeline
# automatisé enfin fonctionnel et versionné.
#
# Si votre topologie de production diverge un jour de la référence
# infrastructure (docker-compose.yml) — par ex. des limites de ressources
# différentes, ou des services supplémentaires propres à la prod — modifiez
# CE fichier, pas docker-compose.yml, pour que la divergence reste
# explicite et versionnée plutôt que vécue seulement sur le serveur.

name: kauri-prod

services:
  api:
    # Image construite et taguée par le pipeline CI (.github/workflows/deploy.yml,
    # job build-and-push) au format yyyyMMdd.N, poussée sur GitHub Container
    # Registry. Le déploiement fait un `pull`, jamais un `build` — le serveur
    # de production ne compile plus jamais de code lui-même.
    image: ghcr.io/thegoatia/djangui-api:${IMAGE_TAG:-latest}
    ports:
      - "${PORT:-5000}:5000"
    env_file: .env
    environment:
      - PORT=5000
      - NODE_ENV=${NODE_ENV:-production}
      - MONGODB_URI=${MONGODB_URI:-mongodb://${MONGODB_USER:-admin}:${MONGODB_PASSWORD:?MONGODB_PASSWORD is required}@mongodb:27017/kauri?authSource=admin&replicaSet=rs0}
      - REDIS_URL=${REDIS_URL:-redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379}
      - METRICS_TOKEN=${METRICS_TOKEN}
      - NODE_OPTIONS=--max-old-space-size=1843 # Allocate ~90% of RAM to V8 heap
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kauri-network
    volumes:
      - ./uploads:/app/uploads
      - ./backups:/app/backups
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # Doit rester nettement au-dessus de NODE_OPTIONS --max-old-space-size
          # (1843M) ci-dessus — un conteneur limité en dessous du heap V8 qu'on
          # lui autorise garantit un OOM-kill sous charge réelle. 512M (valeur
          # précédente jamais réellement appliquée) aurait provoqué exactement
          # ça au premier redéploiement. Aligné sur ce qui tourne réellement en
          # production depuis des semaines (2Go), avec une marge (2.5Go).
          memory: 2560M
          cpus: '2.0'
        reservations:
          memory: 1G

  mongodb:
    image: mongo:7.0
    entrypoint: >
      /bin/sh -c "cp /data/db/mongodb.key /tmp/mongodb.key && chmod 600 /tmp/mongodb.key && chown 999:999 /tmp/mongodb.key && exec /usr/local/bin/docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --auth --keyFile /tmp/mongodb.key"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGODB_USER:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGODB_PASSWORD:?MONGODB_PASSWORD is required}
    # MongoDB is NOT exposed on the host — accessible only within the Docker network
    expose:
      - "27017"
    volumes:
      - mongodb_data:/data/db
      - ./mongodb.key:/data/db/mongodb.key
    networks:
      - kauri-network
    healthcheck:
      test: [ "CMD-SHELL", "mongosh --port 27017 -u $${MONGO_INITDB_ROOT_USERNAME:-admin} -p $${MONGO_INITDB_ROOT_PASSWORD:?MONGODB_PASSWORD is required} --authenticationDatabase admin --quiet --eval \"db.adminCommand('ping').ok\" || (mongosh --port 27017 -u $${MONGO_INITDB_ROOT_USERNAME:-admin} -p $${MONGO_INITDB_ROOT_PASSWORD:?MONGODB_PASSWORD is required} --authenticationDatabase admin --quiet --eval \"rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]})\" || mongosh --port 27017 --quiet --eval \"rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]})\" && sleep 2)" ]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # Aligné sur ce qui tourne réellement en production (4Go) — la valeur
          # précédente (1Go) était trop juste pour un replica set MongoDB avec
          # des données réelles et n'a jamais été réellement appliquée.
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 2G

  redis:
    image: redis:7-alpine # Version spécifique
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    # Comme MongoDB ci-dessus : accessible uniquement depuis le réseau Docker
    # interne (les autres services de ce compose), jamais depuis l'hôte. Un
    # mot de passe protège déjà l'accès, mais exposer le port sur l'hôte reste
    # une surface d'attaque inutile pour un service qui n'a aucun client hors
    # de ce réseau.
    expose:
      - "6379"
    networks:
      - kauri-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          # 512M (état intermédiaire vérifié fonctionnel lors de l'incident du
          # 29/08/2026, où ce conteneur a été recréé manuellement avec 1Go —
          # 512M est une valeur de croisière plus raisonnable pour ce cas
          # d'usage : sessions, rate-limit, idempotence, verrous — pas un cache
          # de données volumineux).
          memory: 512M
          cpus: '0.5'

  # Centralized Logging (Graylog)
  opensearch:
    image: opensearchproject/opensearch:2.11.0
    environment:
      - cluster.name=opensearch
      - node.name=opensearch
      - discovery.type=single-node
      - OPENSEARCH_JAVA_OPTS=-Xms2g -Xmx2g
      - bootstrap.memory_lock=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks:
      - kauri-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # Aligné sur ce qui tourne réellement (4Go) — OpenSearch réclame déjà
          # 2Go de heap JVM via OPENSEARCH_JAVA_OPTS ci-dessus, 3G ne laissait
          # quasi aucune marge hors-heap.
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 2G

  graylog:
    image: graylog/graylog:5.2
    depends_on:
      opensearch:
        condition: service_started
      mongodb:
        condition: service_healthy
    environment:
      - GRAYLOG_NODE_ID_FILE=/usr/share/graylog/data/config/node-id
      # Generate: pwgen -N 1 -s 96 (min 16 chars, must be unique per installation)
      - GRAYLOG_PASSWORD_SECRET=${GRAYLOG_PASSWORD_SECRET}
      # Generate: echo -n "yourpassword" | sha256sum
      - GRAYLOG_ROOT_PASSWORD_SHA2=${GRAYLOG_ROOT_PASSWORD_SHA2}
      - GRAYLOG_HTTP_BIND_ADDRESS=0.0.0.0:9000
      - GRAYLOG_ELASTICSEARCH_HOSTS=http://opensearch:9200
      - GRAYLOG_MONGODB_URI=mongodb://${MONGODB_USER:-admin}:${MONGODB_PASSWORD}@mongodb:27017/graylog?authSource=admin&replicaSet=rs0
    ports:
      - "${GRAYLOG_HTTP_PORT:-9000}:9000"
      - "${GRAYLOG_GELF_PORT:-12201}:12201/udp"
    networks:
      - kauri-network
    volumes:
      - graylog_data:/usr/share/graylog/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # Aligné sur ce qui tourne réellement en production (4Go).
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 1.5G

  # Monitoring (Prometheus & Grafana)
  prometheus:
    image: prom/prometheus:v2.48.0
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./alerts/rules.yaml:/etc/prometheus/alerts/rules.yaml
      - ./metrics_token:/etc/prometheus/metrics_token:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - kauri-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # Tournait sans AUCUNE limite en production jusqu'ici (vérifié —
          # deploy.resources absent du fichier alors en usage). 1G laisse de
          # la marge pour la cardinalité des 99 métriques exposées par l'API
          # sans risquer de saturer l'hôte partagé.
          memory: 1G
          cpus: '0.5'

  # Alertmanager — routes Prometheus alerts to Email + Slack
  alertmanager:
    image: prom/alertmanager:v0.26.0
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      # Montée en lecture seule comme GABARIT — alertmanager.yml contient des
      # `${VAR:-default}` au format Docker Compose, qu'Alertmanager lui-même
      # ne sait PAS interpréter (il attend du YAML littéral). entrypoint.sh
      # fait la substitution avec `sed` avant de lancer le vrai process. Un
      # vrai fichier de script (pas un bloc YAML inline) pour éviter tout
      # risque que Compose interpole ces `${...}` avant même qu'ils
      # n'atteignent le conteneur.
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml.template:ro
      - ./alertmanager/entrypoint.sh:/alertmanager-entrypoint.sh:ro
    entrypoint: [ "/bin/sh", "/alertmanager-entrypoint.sh" ]
    environment:
      - ALERTMANAGER_PORT=${ALERTMANAGER_PORT:-9093}
      # SMTP
      - ALERTMANAGER_SMTP_HOST=${ALERTMANAGER_SMTP_HOST:-smtp.gmail.com:587}
      - ALERTMANAGER_SMTP_FROM=${ALERTMANAGER_SMTP_FROM:-alerts@kauri-app.com}
      - ALERTMANAGER_SMTP_USER=${ALERTMANAGER_SMTP_USER:-alerts@kauri-app.com}
      - ALERTMANAGER_SMTP_PASSWORD=${ALERTMANAGER_SMTP_PASSWORD:-changeme}
      # Recipients
      - ALERTMANAGER_EMAIL_TO=${ALERTMANAGER_EMAIL_TO:-ops@kauri-app.com}
      - ALERTMANAGER_FINTECH_EMAIL=${ALERTMANAGER_FINTECH_EMAIL:-fintech@kauri-app.com}
      - ALERTMANAGER_SECURITY_EMAIL=${ALERTMANAGER_SECURITY_EMAIL:-security@kauri-app.com}
      # Slack webhooks
      - ALERTMANAGER_SLACK_WEBHOOK_URL=${ALERTMANAGER_SLACK_WEBHOOK_URL:-https://hooks.slack.com/services/CHANGE/ME}
    networks:
      - kauri-network
    restart: unless-stopped
    deploy:
      resources:
        # N'avait jamais eu de limite du tout (service entièrement absent de
        # tout bloc `deploy:` dans la version précédente du fichier).
        limits:
          memory: 256M
          cpus: '0.25'

  grafana:
    image: grafana/grafana:10.2.2
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
      - alertmanager
    networks:
      - kauri-network
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/etc/grafana/dashboards
    environment:
      # Admin credentials
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      # SMTP for Grafana Unified Alerting
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=${GRAFANA_SMTP_HOST:-smtp.gmail.com:587}
      - GF_SMTP_USER=${GRAFANA_SMTP_USER:-alerts@kauri-app.com}
      - GF_SMTP_PASSWORD=${GRAFANA_SMTP_PASSWORD:-changeme}
      - GF_SMTP_FROM_ADDRESS=${GRAFANA_SMTP_FROM:-alerts@kauri-app.com}
      - GF_SMTP_FROM_NAME=Kauri Alerting
      - GF_SMTP_STARTTLS_POLICY=MandatoryStartTLS
      # Unified Alerting — point to Alertmanager
      - GF_UNIFIED_ALERTING_ENABLED=true
      - GF_ALERTING_ENABLED=false
      - GF_UNIFIED_ALERTING_ALERTMANAGER_ENABLED=true
      - GF_UNIFIED_ALERTING_ALERTMANAGER_URL=http://alertmanager:9093
      # Contact point Slack webhooks (used by provisioning templates)
      - GRAFANA_SLACK_WEBHOOK_CRITICAL=${GRAFANA_SLACK_WEBHOOK_CRITICAL:-https://hooks.slack.com/services/CHANGE/ME}
      - GRAFANA_SLACK_WEBHOOK_WARNINGS=${GRAFANA_SLACK_WEBHOOK_WARNINGS:-https://hooks.slack.com/services/CHANGE/ME}
      - GRAFANA_SLACK_WEBHOOK_FINTECH=${GRAFANA_SLACK_WEBHOOK_FINTECH:-https://hooks.slack.com/services/CHANGE/ME}
      - GRAFANA_SLACK_WEBHOOK_SECURITY=${GRAFANA_SLACK_WEBHOOK_SECURITY:-https://hooks.slack.com/services/CHANGE/ME}
      - GRAFANA_ALERT_EMAIL_TO=${GRAFANA_ALERT_EMAIL_TO:-ops@kauri-app.com}
      # Grafana base URL (needed for alert links in notifications)
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:3001}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # Tournait sans AUCUNE limite en production jusqu'ici (vérifié).
          memory: 1G
          cpus: '0.5'

  # OpenTelemetry
  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "${JAEGER_PORT:-16686}:16686" # Web UI
      - "${JAEGER_COLLECTOR_HTTP_PORT:-14268}:14268" # Collector HTTP
      - "${JAEGER_COLLECTOR_GRPC_PORT:-14250}:14250" # Collector gRPC
    networks:
      - kauri-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # Tournait sans AUCUNE limite en production jusqu'ici (vérifié).
          memory: 512M
          cpus: '0.5'

  otel-collector:
    image: otel/opentelemetry-collector:latest
    command: [ "--config=/etc/otel-collector-config.yaml" ]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "${OTEL_PORT_GRPC:-4317}:4317" # OTLP gRPC
      - "${OTEL_PORT_HTTP:-4318}:4318" # OTLP HTTP
    depends_on:
      - jaeger
    networks:
      - kauri-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # Tournait sans AUCUNE limite en production jusqu'ici (vérifié).
          memory: 512M
          cpus: '0.5'

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-kauriadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio_data:/data
    networks:
      - kauri-network
    command: server /data --console-address ":9001"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3

  # MinIO Client (Auto-config buckets)
  mc:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c " /usr/bin/mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-kauriadmin} ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}; /usr/bin/mc mb --ignore-existing local/kauri-uploads; /usr/bin/mc mb --ignore-existing local/kauri-invoices; /usr/bin/mc mb --ignore-existing local/kauri-backups; /usr/bin/mc mb --ignore-existing local/kauri-avatars; /usr/bin/mc anonymous set public local/kauri-avatars; exit 0; "
    networks:
      - kauri-network

networks:
  kauri-network:
    driver: bridge

volumes:
  mongodb_data:
  opensearch_data:
  graylog_data:
  grafana_data:
  prometheus_data:
  alertmanager_data:
  minio_data:
