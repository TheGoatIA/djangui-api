version: '3.8'

services:
  minio:
    image: minio/minio:latest
    container_name: kauri-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: kauriadmin
      MINIO_ROOT_PASSWORD: kaurisecret
    volumes:
      - kauri_minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  kauri_minio_data:
    driver: local
