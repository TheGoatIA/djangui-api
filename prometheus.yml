global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - '/etc/prometheus/alerts/rules.yaml'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'kauri-api'
    static_configs:
      - targets: ['api:5000']
    metrics_path: '/metrics'
    bearer_token: 'eef6fd9adddbef26192805664cf1a3b402327b3fee6ea98fc72e61ce3fdbf380'

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']
