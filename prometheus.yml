global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - '/etc/prometheus/alerts/rules.yaml'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'kauri-api'
    static_configs:
      - targets: ['api:5000']
    metrics_path: '/metrics'
    # Token injected at runtime via mounted file (never commit the actual token)
    # Generate: openssl rand -hex 32 > /run/secrets/metrics_token
    # Then set METRICS_TOKEN env var on the api container to the same value
    bearer_token_file: /etc/prometheus/metrics_token

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']
