global:
  # SMTP (email) — configure via env in docker-compose
  smtp_smarthost: '${ALERTMANAGER_SMTP_HOST:-smtp.gmail.com:587}'
  smtp_from: '${ALERTMANAGER_SMTP_FROM:-alerts@kauri-app.com}'
  smtp_auth_username: '${ALERTMANAGER_SMTP_USER:-alerts@kauri-app.com}'
  smtp_auth_password: '${ALERTMANAGER_SMTP_PASSWORD:-changeme}'
  smtp_require_tls: true

  # Slack global settings
  slack_api_url: '${ALERTMANAGER_SLACK_WEBHOOK_URL:-https://hooks.slack.com/services/CHANGE/ME}'

  # How long to wait before sending a notification again for a resolved alert
  resolve_timeout: 5m

# ─── Templates ────────────────────────────────────────────────────────────────
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# ─── Routing ──────────────────────────────────────────────────────────────────
route:
  # Default receiver (catches everything not matched below)
  receiver: 'slack-warnings'

  # Group alerts by alertname + team to avoid notification storms
  group_by: ['alertname', 'team', 'severity']
  group_wait: 30s        # Wait before sending the first notification for a group
  group_interval: 5m     # Wait before sending another notification if group changes
  repeat_interval: 4h    # Resend if still firing after 4h

  routes:
    # Critical alerts → email + Slack #alerts-critical
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 10s
      repeat_interval: 1h

    # Fintech-specific critical → extra email to fintech team
    - match:
        severity: critical
        team: fintech
      receiver: 'fintech-critical'
      group_wait: 10s
      repeat_interval: 30m

    # Security alerts → security team
    - match:
        team: security
      receiver: 'security-alerts'
      repeat_interval: 1h

    # Warning alerts → Slack #alerts-warnings only
    - match:
        severity: warning
      receiver: 'slack-warnings'
      repeat_interval: 6h

# ─── Inhibition Rules ─────────────────────────────────────────────────────────
# Suppress warning alerts when a critical alert for the same component fires
inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'team']

# ─── Receivers ────────────────────────────────────────────────────────────────
receivers:
  # Critical: email + Slack
  - name: 'critical-alerts'
    email_configs:
      - to: '${ALERTMANAGER_EMAIL_TO:-ops@kauri-app.com}'
        headers:
          Subject: '[CRITICAL] {{ .GroupLabels.alertname }} — Kauri API'
        html: |
          <h2 style="color:red">🚨 CRITICAL Alert — Kauri API</h2>
          {{ range .Alerts }}
          <p><b>{{ .Annotations.summary }}</b><br/>{{ .Annotations.description }}</p>
          <p>Labels: {{ range .Labels.SortedPairs }}<code>{{ .Name }}={{ .Value }}</code> {{ end }}</p>
          <hr/>
          {{ end }}
        send_resolved: true
    slack_configs:
      - channel: '#alerts-critical'
        title: '🚨 [CRITICAL] {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *{{ .Annotations.summary }}*
          {{ .Annotations.description }}
          {{ if .Annotations.runbook }}📖 Runbook: {{ .Annotations.runbook }}{{ end }}
          Labels: {{ range .Labels.SortedPairs }}`{{ .Name }}={{ .Value }}` {{ end }}
          {{ end }}
        color: '#FF0000'
        send_resolved: true
        icon_emoji: ':rotating_light:'

  # Fintech critical: adds fintech team email
  - name: 'fintech-critical'
    email_configs:
      - to: '${ALERTMANAGER_FINTECH_EMAIL:-fintech@kauri-app.com}'
        headers:
          Subject: '[CRITICAL/FINTECH] {{ .GroupLabels.alertname }} — Kauri API'
        html: |
          <h2 style="color:red">💳 FINTECH CRITICAL Alert</h2>
          {{ range .Alerts }}
          <p><b>{{ .Annotations.summary }}</b><br/>{{ .Annotations.description }}</p>
          {{ end }}
        send_resolved: true
    slack_configs:
      - channel: '#alerts-fintech'
        title: '💳 [CRITICAL/FINTECH] {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *{{ .Annotations.summary }}*
          {{ .Annotations.description }}
          {{ end }}
        color: '#FF6600'
        send_resolved: true
        icon_emoji: ':money_with_wings:'

  # Security alerts
  - name: 'security-alerts'
    email_configs:
      - to: '${ALERTMANAGER_SECURITY_EMAIL:-security@kauri-app.com}'
        headers:
          Subject: '[SECURITY] {{ .GroupLabels.alertname }} — Kauri API'
        html: |
          <h2 style="color:darkred">🔒 Security Alert</h2>
          {{ range .Alerts }}
          <p><b>{{ .Annotations.summary }}</b><br/>{{ .Annotations.description }}</p>
          {{ end }}
        send_resolved: true
    slack_configs:
      - channel: '#alerts-security'
        title: '🔒 [SECURITY] {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *{{ .Annotations.summary }}*
          {{ .Annotations.description }}
          {{ end }}
        color: '#8B0000'
        send_resolved: true
        icon_emoji: ':lock:'

  # Warning: Slack only
  - name: 'slack-warnings'
    slack_configs:
      - channel: '#alerts-warnings'
        title: '⚠️ [WARNING] {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *{{ .Annotations.summary }}*
          {{ .Annotations.description }}
          {{ end }}
        color: '#FFA500'
        send_resolved: true
        icon_emoji: ':warning:'
