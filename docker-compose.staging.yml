services:
  api-staging:
    build: .
    ports:
      - "${STAGING_PORT:-5001}:5000"
    env_file: .env.staging
    environment:
      - NODE_ENV=staging
      - MONGODB_URI=mongodb://mongodb-staging:27017/kauri_staging?replicaSet=rs0
      - REDIS_URL=redis://redis-staging:6379
    depends_on:
      mongodb-staging:
        condition: service_healthy
      redis-staging:
        condition: service_healthy
    networks:
      - kauri-staging-network
    volumes:
      - ./uploads-staging:/app/uploads
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  mongodb-staging:
    image: mongo:7.0
    command: [ "--replSet", "rs0", "--bind_ip_all" ]
    ports:
      - "${STAGING_MONGODB_PORT:-27018}:27017"
    volumes:
      - mongodb_staging_data:/data/db
    networks:
      - kauri-staging-network
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
    healthcheck:
      test: echo "try { rs.status() } catch (err) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb-staging:27017'}]}) }" | mongosh --port 27017 --quiet
      interval: 10s
      timeout: 30s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  redis-staging:
    image: redis:7-alpine
    ports:
      - "${STAGING_REDIS_PORT:-6380}:6379"
    networks:
      - kauri-staging-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.2'
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  kauri-staging-network:
    driver: bridge

volumes:
  mongodb_staging_data:
