# Supprimer la ligne version (obsolète)
# name: fixe le préfixe des conteneurs (kauri-staging-api-1...) — voir
# RUNBOOK.md § Migration de renommage des conteneurs (29/08/2026).
name: kauri-staging

services:
  api:
    # Image construite et taguée par le pipeline CI (.github/workflows/deploy.yml,
    # job build-and-push) au format yyyyMMdd.N ou "staging-latest", poussée sur
    # GitHub Container Registry. Le déploiement fait un `pull`, jamais un `build`.
    image: ghcr.io/thegoatia/djangui-api:${IMAGE_TAG:-staging-latest}
    ports:
      - "${PORT:-5000}:5000"
    env_file: .env
    environment:
      - PORT=5000
      - NODE_ENV=${NODE_ENV:-production}
      - MONGODB_URI=${MONGODB_URI:-mongodb://${MONGODB_USER:-admin}:${MONGODB_PASSWORD:-password}@mongodb:27017/kauri?authSource=admin&replicaSet=rs0}
      - REDIS_URL=${REDIS_URL:-redis://:${REDIS_PASSWORD}@redis:6379}
      - METRICS_TOKEN=${METRICS_TOKEN}
      - NODE_OPTIONS=--max-old-space-size=1843 # Allocate ~90% of RAM to V8 heap
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - kauri-network
    volumes:
      - ./uploads:/app/uploads
      - ./backups:/app/backups
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # L'image de staging tourne en PM2 cluster mode avec `instances: 'max'`
          # (un worker par CPU détecté sur l'hôte, 12 sur ce serveur) — PM2 lit
          # le nombre de CPU réel de l'hôte, pas le quota cgroup du conteneur.
          # Avec seulement 1.0 CPU pour 12 workers, chacun est tellement affamé
          # qu'aucun ne termine jamais son démarrage (aucun log, aucun port
          # ouvert, malgré un statut PM2 "online"). 4.0 laisse assez de marge
          # réelle pour que les 12 workers démarrent en ~30-40s.
          memory: 2G
          cpus: '4.0'
        reservations:
          memory: 1G

  mongodb:
    image: mongo:7.0
    entrypoint: |
      /bin/sh -c "
      if [ ! -f /data/db/mongodb.key ]; then
        openssl rand -base64 756 > /data/db/mongodb.key
        chmod 600 /data/db/mongodb.key
        chown 999:999 /data/db/mongodb.key
      fi
      exec /usr/local/bin/docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --auth --keyFile /data/db/mongodb.key
      "
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGODB_USER:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGODB_PASSWORD:-password}
      - MONGODB_USER=${MONGODB_USER:-admin}
      - MONGODB_PASSWORD=${MONGODB_PASSWORD:-password}
    # MongoDB is NOT exposed on the host — accessible only within the Docker network
    expose:
      - "27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - kauri-network
    healthcheck:
      test: [ "CMD-SHELL", "mongosh --port 27017 -u $${MONGODB_USER:-admin} -p $${MONGODB_PASSWORD:-password} --authenticationDatabase admin --quiet --eval \"rs.status().ok\" || mongosh --port 27017 -u $${MONGODB_USER:-admin} -p $${MONGODB_PASSWORD:-password} --authenticationDatabase admin --quiet --eval \"rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]})\"" ]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.5'
        reservations:
          memory: 512M

  redis:
    image: redis:7-alpine # Version spécifique
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - kauri-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'

  # Centralized Logging (Graylog)
  opensearch:
    image: opensearchproject/opensearch:2.11.0
    environment:
      - cluster.name=opensearch
      - node.name=opensearch
      - discovery.type=single-node
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - bootstrap.memory_lock=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks:
      - kauri-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G

  graylog:
    image: graylog/graylog:5.2
    depends_on:
      opensearch:
        condition: service_started
      mongodb:
        condition: service_healthy
    environment:
      - GRAYLOG_NODE_ID_FILE=/usr/share/graylog/data/config/node-id
      # Generate: pwgen -N 1 -s 96 (min 16 chars, must be unique per installation)
      - GRAYLOG_PASSWORD_SECRET=${GRAYLOG_PASSWORD_SECRET}
      # Generate: echo -n "yourpassword" | sha256sum
      - GRAYLOG_ROOT_PASSWORD_SHA2=${GRAYLOG_ROOT_PASSWORD_SHA2}
      - GRAYLOG_HTTP_BIND_ADDRESS=0.0.0.0:9000
      - GRAYLOG_ELASTICSEARCH_HOSTS=http://opensearch:9200
      - GRAYLOG_MONGODB_URI=mongodb://${MONGODB_USER:-admin}:${MONGODB_PASSWORD}@mongodb:27017/graylog?authSource=admin&replicaSet=rs0
    ports:
      - "${GRAYLOG_HTTP_PORT:-9000}:9000"
      - "${GRAYLOG_GELF_PORT:-12201}:12201/udp"
    networks:
      - kauri-network
    volumes:
      - graylog_data:/usr/share/graylog/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1.5G
          cpus: '1.0'
        reservations:
          memory: 1G

  # Monitoring (Prometheus & Grafana)
  prometheus:
    image: prom/prometheus:v2.48.0 # Version spécifique
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./alerts/rules.yaml:/etc/prometheus/alerts/rules.yaml
      - ./metrics_token:/etc/prometheus/metrics_token:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - kauri-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  grafana:
    image: grafana/grafana:10.2.2 # Version spécifique
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
    networks:
      - kauri-network
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/etc/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # OpenTelemetry
  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "${JAEGER_PORT:-16686}:16686" # Web UI
      - "${JAEGER_COLLECTOR_HTTP_PORT:-14268}:14268" # Collector HTTP
      - "${JAEGER_COLLECTOR_GRPC_PORT:-14250}:14250" # Collector gRPC
    networks:
      - kauri-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  otel-collector:
    image: otel/opentelemetry-collector:latest
    command: [ "--config=/etc/otel-collector-config.yaml" ]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "${OTEL_PORT_GRPC:-4317}:4317" # OTLP gRPC
      - "${OTEL_PORT_HTTP:-4318}:4318" # OTLP HTTP
    depends_on:
      - jaeger
    networks:
      - kauri-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-kauriadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-kaurisecret}
    volumes:
      - minio_data:/data
    networks:
      - kauri-network
    command: server /data --console-address ":9001"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3

  # MinIO Client (Auto-config buckets)
  mc:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c " /usr/bin/mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-kauriadmin} ${MINIO_ROOT_PASSWORD:-kaurisecret}; /usr/bin/mc mb --ignore-existing local/kauri-uploads; /usr/bin/mc mb --ignore-existing local/kauri-invoices; /usr/bin/mc mb --ignore-existing local/kauri-backups; /usr/bin/mc anonymous set public local/kauri-uploads; /usr/bin/mc anonymous set public local/kauri-invoices; exit 0; "
    networks:
      - kauri-network

networks:
  kauri-network:
    driver: bridge

volumes:
  # `external: true` : ces volumes ont été créés à la main (`docker volume
  # create`) pendant la migration de renommage des conteneurs du 29/08/2026,
  # pas par Compose — sans ce marqueur, Compose les retrouve et les réutilise
  # correctement quand même (aucune perte de données), mais réaffiche un
  # warning "already exists but was not created by Docker Compose" à chaque
  # déploiement. `external: true` fait taire ce warning sans rien déplacer.
  mongodb_data:
    external: true
    name: kauri-staging_mongodb_data
  opensearch_data:
    external: true
    name: kauri-staging_opensearch_data
  graylog_data:
    external: true
    name: kauri-staging_graylog_data
  grafana_data:
    external: true
    name: kauri-staging_grafana_data
  prometheus_data:
    external: true
    name: kauri-staging_prometheus_data
  minio_data:
    external: true
    name: kauri-staging_minio_data
