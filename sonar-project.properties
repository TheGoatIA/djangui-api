# SonarQube Kauri — https://sonar.kauri-app.com (instance dédiée, voir DEPLOYMENT.md § Qualité)
sonar.projectKey=kauri-api
sonar.projectName=Kauri API
sonar.sourceEncoding=UTF-8

# Code applicatif et tests
sonar.sources=src
sonar.tests=tests,src/tests
sonar.test.inclusions=**/*.test.ts
sonar.exclusions=**/node_modules/**,dist/**,coverage/**,logs/**,uploads/**,src/data/**,**/*.d.ts

# Couverture (jest --coverage -> coverage/lcov.info). Exclusions : code de démarrage/outillage
# difficile à tester unitairement, et les fichiers de test eux-mêmes.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/tests/**,tests/**,src/types/**,src/data/**,src/server.ts,src/config/tracing.ts,scripts/**
sonar.typescript.tsconfigPath=tsconfig.json

# Les scripts d'exploitation shell sont analysés ; pas de duplication signalée sur les fixtures de test
sonar.cpd.exclusions=tests/**,src/tests/**

# Faux positif : `then` est la clé OBLIGATOIRE d'une branche d'agrégation MongoDB ($switch/$cond),
# pas un objet « thenable ». Règle S7739 ignorée uniquement sur ce contrôleur.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S7739
sonar.issue.ignore.multicriteria.e1.resourceKey=src/controllers/adminController.ts
