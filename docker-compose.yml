version: '3.8'

services:
  api:
    build: .
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/djangui
      - REDIS_URL=redis://redis:6379
    depends_on:
      - mongodb
      - redis
    networks:
      - djangui-network
    volumes:
      - ./uploads:/app/uploads

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - djangui-network

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - djangui-network

networks:
  djangui-network:
    driver: bridge

volumes:
  mongodb_data:
