version: '3.8'

services:
  api:
    build: .
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/djangui?replicaSet=rs0
      - REDIS_URL=redis://redis:6379
    depends_on:
      - mongodb
      - redis
    networks:
      - djangui-network
    volumes:
      - ./uploads:/app/uploads

  mongodb:
    image: mongo:latest
    command: [ "--replSet", "rs0", "--bind_ip_all" ]
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - djangui-network
    healthcheck:
      test: echo "try { rs.status() } catch (err) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]}) }" | mongosh --port 27017 --quiet
      interval: 10s
      timeout: 30s
      retries: 5
      start_period: 5s

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - djangui-network

networks:
  djangui-network:
    driver: bridge

volumes:
  mongodb_data:
